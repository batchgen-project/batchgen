name: PR GPU Regression v2

on:
  pull_request:
    types: [labeled]
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: pr-gpu-regression-global-v2
  cancel-in-progress: true

jobs:
  resolve:
    # Self-hosted — see comment in build.yml.
    runs-on: self-hosted
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      pr_number:  ${{ steps.gate.outputs.pr_number }}
      pr_sha:     ${{ steps.gate.outputs.pr_sha }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_LABEL_NAME: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          IC_IS_PR: ${{ github.event.issue.pull_request != null }}
          IC_BODY: ${{ github.event.comment.body }}
          IC_AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
          IC_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          should_run=false
          pr_number=
          pr_sha=

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_LABEL_NAME" == "ci:run" && "$PR_HEAD_REPO" == "$REPO" ]]; then
              should_run=true
              pr_number="$PR_NUMBER"
              pr_sha="$PR_HEAD_SHA"
            fi
          elif [[ "$EVENT_NAME" == "issue_comment" ]]; then
            if [[ "$IC_IS_PR" == "true" ]] && [[ "$IC_BODY" =~ ^/test([[:space:]]|$) ]]; then
              case "$IC_AUTHOR_ASSOC" in
                OWNER|MEMBER|COLLABORATOR)
                  pr_data=$(gh api "repos/$REPO/pulls/$IC_ISSUE_NUMBER" \
                    --jq '{sha: .head.sha, repo: .head.repo.full_name}')
                  head_sha=$(echo "$pr_data" | jq -r .sha)
                  head_repo=$(echo "$pr_data" | jq -r .repo)
                  if [[ "$head_repo" == "$REPO" ]]; then
                    should_run=true
                    pr_number="$IC_ISSUE_NUMBER"
                    pr_sha="$head_sha"
                  fi
                  ;;
              esac
            fi
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number"   >> "$GITHUB_OUTPUT"
          echo "pr_sha=$pr_sha"         >> "$GITHUB_OUTPUT"

  test-node0:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: [self-hosted, gpu, node0]
    timeout-minutes: 90
    env:
      PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
      PR_SHA:    ${{ needs.resolve.outputs.pr_sha }}
      REPO:      ${{ github.repository }}
      GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
      DIST_INIT_ADDR:  ${{ secrets.BATCHGEN_DIST_INIT_ADDR }}
      MODEL_CACHE_DIR: ${{ secrets.BATCHGEN_NODE0_MODEL_CACHE }}
    steps:
      - id: check_start
        name: Post in-progress check
        run: |
          set -euo pipefail
          check_id=$(gh api -X POST "repos/$REPO/check-runs" \
            -f name='gpu-regression' \
            -f head_sha="$PR_SHA" \
            -f status='in_progress' \
            --jq '.id')
          echo "check_id=$check_id" >> "$GITHUB_OUTPUT"

      - id: run
        name: Run GLM-5-FP8 regression (rank 0)
        # No actions/checkout; tairan's container has the clone + working
        # SSH to github. docker exec does git fetch + worktree add + runs
        # the in-container script from inside the worktree.
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source /opt/batchgen-ci/env.sh
          WORKTREE="$(dirname "$BATCHGEN_CI_WORKSPACE")/BatchGen-ci-${PR_SHA:0:12}"

          NCCL_ARGS=()
          for var in GLOO_SOCKET_IFNAME NCCL_SOCKET_IFNAME NCCL_IB_DISABLE NCCL_NET \
                     NCCL_OOB_NET_IFNAME NCCL_OOB_NET_ENABLE NCCL_IB_HCA; do
              if [[ -n "${!var:-}" ]]; then
                  NCCL_ARGS+=(-e "$var=${!var}")
              fi
          done

          cleanup() {
              docker exec "$BATCHGEN_CI_CONTAINER" bash -lc "
                  cd '$BATCHGEN_CI_WORKSPACE' 2>/dev/null && \
                  git worktree remove --force '$WORKTREE' 2>/dev/null || true
              " 2>/dev/null || true
          }
          trap cleanup EXIT

          docker exec \
              "${NCCL_ARGS[@]}" \
              -e NODE_RANK=0 \
              -e DIST_INIT_ADDR="$DIST_INIT_ADDR" \
              -e PR_SHA="$PR_SHA" \
              -e WORKTREE_PATH="$WORKTREE" \
              -e WORKSPACE="$BATCHGEN_CI_WORKSPACE" \
              -e BATCHGEN_CI_GLM5_MODEL_DIR="$BATCHGEN_CI_GLM5_MODEL_DIR" \
              -e BATCHGEN_CI_MMLU_THRESHOLD="$BATCHGEN_CI_MMLU_THRESHOLD" \
              -e BATCHGEN_LONGBENCH_DIR="$BATCHGEN_CI_WORKSPACE/tests/e2e/r1_longbench_test/LongBench" \
              -e BATCHGEN_MMLU_PRO_DIR="$BATCHGEN_CI_WORKSPACE/tests/e2e/r1_mmlu_pro_test" \
              "$BATCHGEN_CI_CONTAINER" \
              bash -lc '
                  set -euo pipefail
                  if [ -f /root/miniconda3/etc/profile.d/conda.sh ]; then
                      source /root/miniconda3/etc/profile.d/conda.sh
                      conda activate batchgen
                  fi
                  cd "$WORKSPACE"
                  git fetch --no-tags origin "$PR_SHA"
                  rm -rf "$WORKTREE_PATH"
                  git worktree add "$WORKTREE_PATH" "$PR_SHA"
                  cd "$WORKTREE_PATH"
                  git log -1 --oneline
                  bash .github/workflows/scripts/pr-gpu-smoke-incontainer.sh
              '

      - name: Finalize check
        if: always() && steps.check_start.outputs.check_id != ''
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
          CHECK_ID: ${{ steps.check_start.outputs.check_id }}
        run: |
          conclusion="success"
          if [[ "$RUN_OUTCOME" != "success" ]]; then
            conclusion="failure"
          fi
          gh api -X PATCH "repos/$REPO/check-runs/$CHECK_ID" \
            -f status='completed' \
            -f conclusion="$conclusion"

      - name: Remove ci:run label
        if: always()
        run: gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label ci:run || true

  test-node1:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: [self-hosted, gpu, node1]
    timeout-minutes: 90
    env:
      PR_SHA:    ${{ needs.resolve.outputs.pr_sha }}
      DIST_INIT_ADDR:  ${{ secrets.BATCHGEN_DIST_INIT_ADDR }}
      MODEL_CACHE_DIR: ${{ secrets.BATCHGEN_NODE1_MODEL_CACHE }}
    steps:
      - name: Run GLM-5-FP8 regression (rank 1)
        # Same shape as test-node0: docker exec into tairan's container,
        # git fetch + worktree, then invoke the in-container script.
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source /opt/batchgen-ci/env.sh
          WORKTREE="$(dirname "$BATCHGEN_CI_WORKSPACE")/BatchGen-ci-${PR_SHA:0:12}"

          NCCL_ARGS=()
          for var in GLOO_SOCKET_IFNAME NCCL_SOCKET_IFNAME NCCL_IB_DISABLE NCCL_NET \
                     NCCL_OOB_NET_IFNAME NCCL_OOB_NET_ENABLE NCCL_IB_HCA; do
              if [[ -n "${!var:-}" ]]; then
                  NCCL_ARGS+=(-e "$var=${!var}")
              fi
          done

          cleanup() {
              docker exec "$BATCHGEN_CI_CONTAINER" bash -lc "
                  cd '$BATCHGEN_CI_WORKSPACE' 2>/dev/null && \
                  git worktree remove --force '$WORKTREE' 2>/dev/null || true
              " 2>/dev/null || true
          }
          trap cleanup EXIT

          docker exec \
              "${NCCL_ARGS[@]}" \
              -e NODE_RANK=1 \
              -e DIST_INIT_ADDR="$DIST_INIT_ADDR" \
              -e PR_SHA="$PR_SHA" \
              -e WORKTREE_PATH="$WORKTREE" \
              -e WORKSPACE="$BATCHGEN_CI_WORKSPACE" \
              -e BATCHGEN_CI_GLM5_MODEL_DIR="$BATCHGEN_CI_GLM5_MODEL_DIR" \
              -e BATCHGEN_CI_MMLU_THRESHOLD="$BATCHGEN_CI_MMLU_THRESHOLD" \
              "$BATCHGEN_CI_CONTAINER" \
              bash -lc '
                  set -euo pipefail
                  if [ -f /root/miniconda3/etc/profile.d/conda.sh ]; then
                      source /root/miniconda3/etc/profile.d/conda.sh
                      conda activate batchgen
                  fi
                  cd "$WORKSPACE"
                  git fetch --no-tags origin "$PR_SHA"
                  rm -rf "$WORKTREE_PATH"
                  git worktree add "$WORKTREE_PATH" "$PR_SHA"
                  cd "$WORKTREE_PATH"
                  git log -1 --oneline
                  bash .github/workflows/scripts/pr-gpu-smoke-incontainer.sh
              '
