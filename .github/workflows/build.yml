name: Build Test

on:
  push:
    branches:
      - main
      - master
      - dev
      - release*
      - prepare-for-open-source

    paths-ignore:
      - '**.md'
      - 'examples/**'
      - 'docs/**'

  pull_request:
    branches:
      - main
      - master
      - dev
      - release*

    paths-ignore:
      - '**.md'
      - 'examples/**'
      - 'docs/**'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Run on H20 node0. The image already has torch + numa + cufile + CUDA
    # toolkit + conda env, so we skip the ~15 min of system / Python setup
    # that ubuntu-22.04 needed. Build runs in the same image as
    # gpu-regression so what builds here is what gets tested there.
    # Fork-PR safety relies on the repo-level "Require approval for outside
    # collaborators" setting (same protection gpu-regression depends on).
    runs-on: [self-hosted, gpu, node0]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build wheel inside batchgen image
        run: bash .github/workflows/scripts/build.sh
