name: Build Test

# Triggers:
#   - PR labeled `ci:run` by a maintainer
#   - workflow_dispatch from the Actions UI (manual rerun without re-labeling)
# No issue_comment, no resolve fan-out, no concurrency group.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test (so the check-run posts against the right HEAD)"
        required: true
        type: string

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'ci:run' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, gpu, node0]
    timeout-minutes: 30
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
    steps:
      - id: resolve_sha
        name: Resolve PR HEAD SHA
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_HEAD_SHA:-}" ]]; then
            sha="$PR_HEAD_SHA"
          else
            sha=$(curl -sS -f -H "Authorization: token $GH_TOKEN" \
                       -H "Accept: application/vnd.github+json" \
                       "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER" \
                  | python3 -c 'import json,sys;print(json.load(sys.stdin)["head"]["sha"])')
          fi
          echo "pr_sha=$sha" >> "$GITHUB_OUTPUT"

      - id: check_start
        name: Post in-progress check
        env:
          PR_SHA: ${{ steps.resolve_sha.outputs.pr_sha }}
        run: |
          set -euo pipefail
          check_id=$(curl -sS -f -X POST -H "Authorization: token $GH_TOKEN" \
                       -H "Accept: application/vnd.github+json" \
                       -d "{\"name\":\"build\",\"head_sha\":\"$PR_SHA\",\"status\":\"in_progress\"}" \
                       "https://api.github.com/repos/$REPO/check-runs" \
                  | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          echo "check_id=$check_id" >> "$GITHUB_OUTPUT"

      - id: run
        name: Build wheel inside tairan's container
        env:
          PR_SHA: ${{ steps.resolve_sha.outputs.pr_sha }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source /opt/batchgen-ci/env.sh
          WORKTREE="$(dirname "$BATCHGEN_CI_WORKSPACE")/BatchGen-ci-${PR_SHA:0:12}"

          cleanup() {
              docker exec "$BATCHGEN_CI_CONTAINER" bash -lc "
                  cd '$BATCHGEN_CI_WORKSPACE' 2>/dev/null && \
                  git worktree remove --force '$WORKTREE' 2>/dev/null || true
              " 2>/dev/null || true
          }
          trap cleanup EXIT

          docker exec \
              -e PR_SHA="$PR_SHA" \
              -e WORKTREE="$WORKTREE" \
              -e WORKSPACE="$BATCHGEN_CI_WORKSPACE" \
              "$BATCHGEN_CI_CONTAINER" \
              bash -lc '
                  set -euo pipefail
                  if [ -f /root/miniconda3/etc/profile.d/conda.sh ]; then
                      source /root/miniconda3/etc/profile.d/conda.sh
                      conda activate batchgen
                  fi
                  echo "python: $(which python) ($(python --version 2>&1))"

                  cd "$WORKSPACE"
                  echo "--- git fetch $PR_SHA ---"
                  git fetch --no-tags origin "$PR_SHA"
                  rm -rf "$WORKTREE"
                  echo "--- git worktree add ---"
                  git worktree add "$WORKTREE" "$PR_SHA"

                  cd "$WORKTREE"
                  git log -1 --oneline
                  echo "--- pip wheel ---"
                  BUILD_OPS=1 pip wheel . --no-deps --no-build-isolation -v -w dist/
                  ls -la dist/
              '

      - name: Finalize check
        if: always() && steps.check_start.outputs.check_id != ''
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
          CHECK_ID: ${{ steps.check_start.outputs.check_id }}
        run: |
          conclusion="success"
          if [[ "$RUN_OUTCOME" != "success" ]]; then
            conclusion="failure"
          fi
          curl -sS -f -X PATCH -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -d "{\"status\":\"completed\",\"conclusion\":\"$conclusion\"}" \
               "https://api.github.com/repos/$REPO/check-runs/$CHECK_ID" >/dev/null
