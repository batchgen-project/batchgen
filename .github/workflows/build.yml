name: Build Test

on:
  push:
    branches:
      - main
      - master
      - dev
      - release*
      - prepare-for-open-source

    paths-ignore:
      - '**.md'
      - 'examples/**'
      - 'docs/**'

  pull_request:
    branches:
      - main
      - master
      - dev
      - release*

    paths-ignore:
      - '**.md'
      - 'examples/**'
      - 'docs/**'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Free disk space
        # ubuntu-22.04 runners ship with ~14 GB free; torch + CUDA wheels pull
        # ~2 GB on top of the CUDA 12.1 toolkit and overflow the root disk.
        # Drop pre-installed toolchains we don't use before Python lands.
        run: bash -x .github/workflows/scripts/free-disk-space.sh

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install CUDA 12.1
        run: |
          bash -x .github/workflows/scripts/cuda-install.sh 12.1 ubuntu-22.04

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Wheel
        # --wheel skips the sdist round-trip; sdist doesn't ship the top-level
        # op_builder/ / core/ / external/ dirs (CustomBuildPy expects them in
        # source-tree mode), so wheel-from-sdist fails on setup.py's
        # `from op_builder.all_ops import ALL_OPS`. publish-test.yml uses the
        # same --wheel flag for the same reason.
        run: |
          BUILD_OPS=1 python3 -m build --wheel
