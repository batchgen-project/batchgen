name: Build and Push to DockerHub

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push-ghcr:
    runs-on: [self-hosted, gpu, node0]
    timeout-minutes: 360

    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "${GITHUB_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Extract image tags
        id: vars
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "ghcr_image=ghcr.io/${owner}/batchgen-release:${tag}" >> "${GITHUB_OUTPUT}"

      - name: Prepare release build context on node0
        run: |
          context_dir="${RUNNER_TEMP}/batchgen-release-context"
          rm -rf "${context_dir}"
          mkdir -p "${context_dir}"
          docker exec \
            -e RELEASE_TAG="${GITHUB_REF#refs/tags/}" \
            tairan-batchgen \
            bash -lc 'set -euo pipefail; cd /data2/tairan/workspace/BatchGen; git fetch --quiet --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"; commit="$(git rev-list -n 1 "${RELEASE_TAG}")"; git archive --format=tar "${commit}"' \
            | tar -x -C "${context_dir}"
          mkdir -p "${context_dir}/.docker-build/third_party"
          download_archive() {
            local url="$1"
            local dest="$2"
            shift 2
            mkdir -p "${dest}"
            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 5 \
              --connect-timeout 20 \
              --max-time 600 \
              --silent \
              --show-error \
              "$@" \
              "${url}" | tar -xz --strip-components=1 -C "${dest}"
          }
          third_party="${context_dir}/.docker-build/third_party"
          download_archive \
            "https://codeload.github.com/Dao-AILab/flash-attention/tar.gz/v2.8.2" \
            "${third_party}/flash-attention"
          download_archive \
            "https://codeload.github.com/NVIDIA/cutlass/tar.gz/dc4817921edda44a549197ff3a9dcf5df0636e7b" \
            "${third_party}/flash-attention/csrc/cutlass"
          download_archive \
            "https://codeload.github.com/deepseek-ai/FlashMLA/tar.gz/1408756a88e52a25196b759eaf8db89d2b51b5a1" \
            "${third_party}/FlashMLA"
          download_archive \
            "https://codeload.github.com/NVIDIA/cutlass/tar.gz/e94e888df3551224738bfa505787b515eae8352f" \
            "${third_party}/FlashMLA/csrc/cutlass"
          download_archive \
            "https://codeload.github.com/deepseek-ai/DeepGEMM/tar.gz/v2.1.1.post3" \
            "${third_party}/DeepGEMM"
          download_archive \
            "https://codeload.github.com/NVIDIA/cutlass/tar.gz/f3fde58372d33e9a5650ba7b80fc48b3b49d40c8" \
            "${third_party}/DeepGEMM/third-party/cutlass"
          download_archive \
            "https://codeload.github.com/fmtlib/fmt/tar.gz/553ec11ec06fbe0beebfbb45f9dc3c9eabd83d28" \
            "${third_party}/DeepGEMM/third-party/fmt"
          echo "context_dir=${context_dir}" >> "${GITHUB_ENV}"
          find "${third_party}" -maxdepth 2 -mindepth 1 -type d | sort

      - name: Build and push GHCR image on node0
        env:
          DOCKER_BUILDKIT: "1"
          GHCR_IMAGE: ${{ steps.vars.outputs.ghcr_image }}
        run: |
          docker build \
            --pull=false \
            --progress=plain \
            --build-context third_party="${context_dir}/.docker-build/third_party" \
            --build-arg BUILD_PARALLEL_JOBS=4 \
            --file "${context_dir}/docker/Dockerfile.release-ci" \
            --tag "${GHCR_IMAGE}" \
            "${context_dir}"
          docker push "${GHCR_IMAGE}"

  mirror-to-dockerhub:
    runs-on: ubuntu-latest
    needs: build-and-push-ghcr
    timeout-minutes: 120

    permissions:
      contents: read
      packages: read

    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Extract image tags
        id: vars
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "ghcr_image=ghcr.io/${owner}/batchgen-release:${tag}" >> "${GITHUB_OUTPUT}"
          echo "dockerhub_image=docker.io/${{ vars.DOCKERHUB_USERNAME }}/0ab602a9:${tag}" >> "${GITHUB_OUTPUT}"

      - name: Mirror GHCR image to DockerHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_IMAGE: ${{ steps.vars.outputs.ghcr_image }}
          DOCKERHUB_IMAGE: ${{ steps.vars.outputs.dockerhub_image }}
        run: |
          skopeo copy \
            --src-creds "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            --dest-creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
            "docker://${GHCR_IMAGE}" \
            "docker://${DOCKERHUB_IMAGE}"
          skopeo inspect \
            --creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
            "docker://${DOCKERHUB_IMAGE}" >/dev/null
