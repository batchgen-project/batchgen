name: Build and Push to DockerHub

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/cuda-* /opt/cuda /usr/local/cuda
          bash -x .github/workflows/scripts/free-disk-space.sh
          docker system prune -af || true
          df -h

      - name: Log in to DockerHub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "${DOCKERHUB_TOKEN}" | docker login \
              --username "${DOCKERHUB_USERNAME}" \
              --password-stdin && exit 0
            echo "DockerHub login attempt ${attempt} failed; retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Extract version tag
        id: vars
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push image
        env:
          DOCKER_BUILDKIT: "1"
          IMAGE_TAG: ${{ vars.DOCKERHUB_USERNAME }}/0ab602a9:${{ steps.vars.outputs.tag }}
        run: |
          docker build \
            --progress=plain \
            --build-arg BUILD_PARALLEL_JOBS=1 \
            --file ./docker/Dockerfile \
            --tag "${IMAGE_TAG}" \
            .
          docker push "${IMAGE_TAG}"
