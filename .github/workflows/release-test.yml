name: MMLU Pro Release Test

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Docker image to test"
        required: true
        default: "nvidia/cuda:12.8.0-cudnn-devel-ubuntu22.04"
      dist_init_addr:
        description: "Distributed initialization address (host:port). Defaults to the BATCHGEN_DIST_INIT_ADDR repo secret if left blank."
        required: false
        default: ""
      max_prompts:
        description: "Maximum number of prompts to test (0 for all)"
        required: false
        default: "0"
      max_input_length:
        description: "Maximum input length"
        required: false
        default: "8192"
      max_decoding_length:
        description: "Maximum decoding length"
        required: false
        default: "8192"
      kv_cache_size:
        description: "Host KV cache size"
        required: false
        default: "256"

jobs:
  test-node0:
    name: MMLU Test Node0
    runs-on: [self-hosted, gpu, node0]
    timeout-minutes: 5760
    env:
      DIST_INIT_ADDR: ${{ github.event.inputs.dist_init_addr || secrets.BATCHGEN_DIST_INIT_ADDR }}
      MODEL_CACHE_DIR: ${{ secrets.BATCHGEN_NODE0_MODEL_CACHE }}
      IMAGE: ${{ github.event.inputs.image }}
      MAX_PROMPTS: ${{ github.event.inputs.max_prompts }}
      MAX_INPUT_LENGTH: ${{ github.event.inputs.max_input_length }}
      MAX_DECODING_LENGTH: ${{ github.event.inputs.max_decoding_length }}
      KV_CACHE_SIZE: ${{ github.event.inputs.kv_cache_size }}
    steps:
      - uses: actions/checkout@v4

      - name: Print runner info
        run: |
          echo "Runner: ${{ runner.name }}"

      - name: Check Docker
        run: |
          docker version
          docker info | head -n 30

      - name: Check NVIDIA driver
        run: nvidia-smi

      - name: Run MMLU Test in Container
        run: bash .github/workflows/scripts/release-test-run.sh --node-rank 0

  test-node1:
    name: MMLU Test Node1
    runs-on: [self-hosted, gpu, node1]
    timeout-minutes: 5760
    env:
      DIST_INIT_ADDR: ${{ github.event.inputs.dist_init_addr || secrets.BATCHGEN_DIST_INIT_ADDR }}
      MODEL_CACHE_DIR: ${{ secrets.BATCHGEN_NODE1_MODEL_CACHE }}
      IMAGE: ${{ github.event.inputs.image }}
      MAX_PROMPTS: ${{ github.event.inputs.max_prompts }}
      MAX_INPUT_LENGTH: ${{ github.event.inputs.max_input_length }}
      MAX_DECODING_LENGTH: ${{ github.event.inputs.max_decoding_length }}
      KV_CACHE_SIZE: ${{ github.event.inputs.kv_cache_size }}
    steps:
      - uses: actions/checkout@v4

      - name: Print runner info
        run: |
          echo "Runner: ${{ runner.name }}"

      - name: Check Docker
        run: |
          docker version
          docker info | head -n 30

      - name: Check NVIDIA driver
        run: nvidia-smi

      - name: Run MMLU Test in Container
        run: bash .github/workflows/scripts/release-test-run.sh --node-rank 1
