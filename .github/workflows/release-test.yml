name: MMLU Pro Test On H20 Nodes

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Docker image to test"
        required: true
        default: "nvidia/cuda:12.8.0-cudnn-devel-ubuntu22.04"
      dist_init_addr:
        description: "Distributed initialization address (host:port). Defaults to the BATCHGEN_DIST_INIT_ADDR repo secret if left blank."
        required: false
        default: ""
      max_prompts:
        description: "Maximum number of prompts to test (0 for all)"
        required: false
        default: "0"
      max_input_length:
        description: "Maximum input length"
        required: false
        default: "8192"
      max_decoding_length:
        description: "Maximum decoding length"
        required: false
        default: "8192"
      kv_cache_size:
        description: "Host KV cache size"
        required: false
        default: "256"

jobs:
  test-node0:
    name: MMLU Test Node0
    runs-on: [self-hosted, gpu, 8-gpu-h20-node0]
    timeout-minutes: 5760
    env:
      DIST_INIT_ADDR: ${{ github.event.inputs.dist_init_addr || secrets.BATCHGEN_DIST_INIT_ADDR }}
      MODEL_CACHE_DIR: ${{ secrets.BATCHGEN_NODE0_MODEL_CACHE }}
    steps:
      - name: Print runner info
        run: |
          echo "Runner: ${{ runner.name }}"
          echo "Labels: ${{ toJson(runner.labels) }}"

      - name: Check Docker
        run: |
          docker version
          docker info | head -n 30

      - name: Check NVIDIA driver
        run: nvidia-smi

      - name: Run MMLU Test in Container
        run: |
          docker run --rm --gpus all \
            -e GLOO_SOCKET_IFNAME=bond0 \
            -e NCCL_SOCKET_IFNAME=bond0 \
            -e NCCL_IB_DISABLE='0' \
            -e NCCL_NET="ib" \
            -e NCCL_OOB_NET_IFNAME="mlx5_" \
            -e NCCL_OOB_NET_ENABLE=1 \
            -e NCCL_IB_HCA=mlx5_bond_0,mlx5_bond_1,mlx5_bond_2,mlx5_bond_3,mlx5_bond_4,mlx5_bond_5,mlx5_bond_6,mlx5_bond_7 \
            -v "${MODEL_CACHE_DIR}":/root/.cache/huggingface/hub/models/deepseek-ai/DeepSeek-R1/ \
            --network host \
            --privileged \
            --shm-size 512g \
            --ipc=host \
            ${{ github.event.inputs.image }} \
            bash .github/workflows/scripts/test-mmlu.sh \
            --node-rank 0 \
            --dist-init-addr "${DIST_INIT_ADDR}" \
            --cache-dir "/root/.cache/huggingface/hub/models/deepseek-ai/DeepSeek-R1/" \
            --max-prompts "${{ github.event.inputs.max_prompts }}" \
            --max-input-length "${{ github.event.inputs.max_input_length }}" \
            --max-decoding-length "${{ github.event.inputs.max_decoding_length }}" \
            --kv-cache-size "${{ github.event.inputs.kv_cache_size }}"

  test-node1:
    name: MMLU Test Node1
    runs-on: [self-hosted, gpu, 8-gpu-h20-node1]
    timeout-minutes: 5760
    env:
      DIST_INIT_ADDR: ${{ github.event.inputs.dist_init_addr || secrets.BATCHGEN_DIST_INIT_ADDR }}
      MODEL_CACHE_DIR: ${{ secrets.BATCHGEN_NODE1_MODEL_CACHE }}
    steps:
      - name: Print runner info
        run: |
          echo "Runner: ${{ runner.name }}"
          echo "Labels: ${{ toJson(runner.labels) }}"

      - name: Check Docker
        run: |
          docker version
          docker info | head -n 30

      - name: Check NVIDIA driver
        run: nvidia-smi

      - name: Run MMLU Test in Container
        run: |
          docker run --rm --gpus all \
            -e GLOO_SOCKET_IFNAME=bond0 \
            -e NCCL_SOCKET_IFNAME=bond0 \
            -e NCCL_IB_DISABLE='0' \
            -e NCCL_NET="ib" \
            -e NCCL_OOB_NET_IFNAME="mlx5_" \
            -e NCCL_OOB_NET_ENABLE=1 \
            -e NCCL_IB_HCA=mlx5_bond_0,mlx5_bond_1,mlx5_bond_2,mlx5_bond_3,mlx5_bond_4,mlx5_bond_5,mlx5_bond_6,mlx5_bond_7 \
            -v "${MODEL_CACHE_DIR}":/root/.cache/huggingface/hub/models/deepseek-ai/DeepSeek-R1/ \
            --network host \
            --privileged \
            --shm-size 512g \
            --ipc=host \
            ${{ github.event.inputs.image }} \
            bash .github/workflows/scripts/test-mmlu.sh \
            --node-rank 1 \
            --dist-init-addr "${DIST_INIT_ADDR}" \
            --cache-dir "/root/.cache/huggingface/hub/models/deepseek-ai/DeepSeek-R1/" \
            --max-prompts "${{ github.event.inputs.max_prompts }}" \
            --max-input-length "${{ github.event.inputs.max_input_length }}" \
            --max-decoding-length "${{ github.event.inputs.max_decoding_length }}" \
            --kv-cache-size "${{ github.event.inputs.kv_cache_size }}"
