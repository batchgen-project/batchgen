name: PR GPU Regression

# Triggers:
#   - PR labeled `ci:run` by a maintainer
#   - workflow_dispatch from the Actions UI (manual rerun without re-labeling)
# No issue_comment, no resolve fan-out, no concurrency group.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test (so the check-run + label-cleanup target the right PR)"
        required: true
        type: string

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test-node0:
    # Gate: workflow_dispatch always runs; pull_request only when the new
    # label is `ci:run` AND the PR head is in this repo (fork-PR safety).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'ci:run' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, gpu, node0]
    timeout-minutes: 90
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
    steps:
      - id: resolve_sha
        name: Resolve PR HEAD SHA
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_HEAD_SHA:-}" ]]; then
            sha="$PR_HEAD_SHA"
          else
            sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          fi
          echo "pr_sha=$sha" >> "$GITHUB_OUTPUT"

      - id: check_start
        name: Post in-progress check
        env:
          PR_SHA: ${{ steps.resolve_sha.outputs.pr_sha }}
        run: |
          set -euo pipefail
          check_id=$(gh api -X POST "repos/$REPO/check-runs" \
            -f name='gpu-regression' \
            -f head_sha="$PR_SHA" \
            -f status='in_progress' \
            --jq '.id')
          echo "check_id=$check_id" >> "$GITHUB_OUTPUT"

      - id: run
        name: Run GLM-5-FP8 regression (rank 0)
        env:
          PR_SHA: ${{ steps.resolve_sha.outputs.pr_sha }}
          DIST_INIT_ADDR: ${{ secrets.BATCHGEN_DIST_INIT_ADDR }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source /opt/batchgen-ci/env.sh
          WORKTREE="$(dirname "$BATCHGEN_CI_WORKSPACE")/BatchGen-ci-${PR_SHA:0:12}"

          NCCL_ARGS=()
          for var in GLOO_SOCKET_IFNAME NCCL_SOCKET_IFNAME NCCL_IB_DISABLE NCCL_NET \
                     NCCL_OOB_NET_IFNAME NCCL_OOB_NET_ENABLE NCCL_IB_HCA; do
              if [[ -n "${!var:-}" ]]; then
                  NCCL_ARGS+=(-e "$var=${!var}")
              fi
          done

          cleanup() {
              docker exec "$BATCHGEN_CI_CONTAINER" bash -lc "
                  cd '$BATCHGEN_CI_WORKSPACE' 2>/dev/null && \
                  git worktree remove --force '$WORKTREE' 2>/dev/null || true
              " 2>/dev/null || true
          }
          trap cleanup EXIT

          docker exec \
              "${NCCL_ARGS[@]}" \
              -e NODE_RANK=0 \
              -e DIST_INIT_ADDR="$DIST_INIT_ADDR" \
              -e PR_SHA="$PR_SHA" \
              -e WORKTREE_PATH="$WORKTREE" \
              -e WORKSPACE="$BATCHGEN_CI_WORKSPACE" \
              -e BATCHGEN_CI_GLM5_MODEL_DIR="$BATCHGEN_CI_GLM5_MODEL_DIR" \
              -e BATCHGEN_CI_MMLU_THRESHOLD="$BATCHGEN_CI_MMLU_THRESHOLD" \
              -e BATCHGEN_LONGBENCH_DIR="$BATCHGEN_CI_WORKSPACE/tests/e2e/r1_longbench_test/LongBench" \
              -e BATCHGEN_MMLU_PRO_DIR="$BATCHGEN_CI_WORKSPACE/tests/e2e/r1_mmlu_pro_test" \
              "$BATCHGEN_CI_CONTAINER" \
              bash -lc '
                  set -euo pipefail
                  if [ -f /root/miniconda3/etc/profile.d/conda.sh ]; then
                      source /root/miniconda3/etc/profile.d/conda.sh
                      conda activate batchgen
                  fi
                  cd "$WORKSPACE"
                  git fetch --no-tags origin "$PR_SHA"
                  rm -rf "$WORKTREE_PATH"
                  git worktree add "$WORKTREE_PATH" "$PR_SHA"
                  cd "$WORKTREE_PATH"
                  git log -1 --oneline
                  bash .github/workflows/scripts/pr-gpu-smoke-incontainer.sh
              '

      - name: Finalize check
        if: always() && steps.check_start.outputs.check_id != ''
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
          CHECK_ID: ${{ steps.check_start.outputs.check_id }}
        run: |
          conclusion="success"
          if [[ "$RUN_OUTCOME" != "success" ]]; then
            conclusion="failure"
          fi
          gh api -X PATCH "repos/$REPO/check-runs/$CHECK_ID" \
            -f status='completed' \
            -f conclusion="$conclusion"

      - name: Remove ci:run label
        if: always() && github.event_name == 'pull_request'
        run: gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label ci:run || true

  test-node1:
    # Same gate as test-node0; runs in parallel on node1.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'ci:run' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, gpu, node1]
    timeout-minutes: 90
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
    steps:
      - id: resolve_sha
        name: Resolve PR HEAD SHA
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_HEAD_SHA:-}" ]]; then
            sha="$PR_HEAD_SHA"
          else
            sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          fi
          echo "pr_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Run GLM-5-FP8 regression (rank 1)
        env:
          PR_SHA: ${{ steps.resolve_sha.outputs.pr_sha }}
          DIST_INIT_ADDR: ${{ secrets.BATCHGEN_DIST_INIT_ADDR }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source /opt/batchgen-ci/env.sh
          WORKTREE="$(dirname "$BATCHGEN_CI_WORKSPACE")/BatchGen-ci-${PR_SHA:0:12}"

          NCCL_ARGS=()
          for var in GLOO_SOCKET_IFNAME NCCL_SOCKET_IFNAME NCCL_IB_DISABLE NCCL_NET \
                     NCCL_OOB_NET_IFNAME NCCL_OOB_NET_ENABLE NCCL_IB_HCA; do
              if [[ -n "${!var:-}" ]]; then
                  NCCL_ARGS+=(-e "$var=${!var}")
              fi
          done

          cleanup() {
              docker exec "$BATCHGEN_CI_CONTAINER" bash -lc "
                  cd '$BATCHGEN_CI_WORKSPACE' 2>/dev/null && \
                  git worktree remove --force '$WORKTREE' 2>/dev/null || true
              " 2>/dev/null || true
          }
          trap cleanup EXIT

          docker exec \
              "${NCCL_ARGS[@]}" \
              -e NODE_RANK=1 \
              -e DIST_INIT_ADDR="$DIST_INIT_ADDR" \
              -e PR_SHA="$PR_SHA" \
              -e WORKTREE_PATH="$WORKTREE" \
              -e WORKSPACE="$BATCHGEN_CI_WORKSPACE" \
              -e BATCHGEN_CI_GLM5_MODEL_DIR="$BATCHGEN_CI_GLM5_MODEL_DIR" \
              -e BATCHGEN_CI_MMLU_THRESHOLD="$BATCHGEN_CI_MMLU_THRESHOLD" \
              "$BATCHGEN_CI_CONTAINER" \
              bash -lc '
                  set -euo pipefail
                  if [ -f /root/miniconda3/etc/profile.d/conda.sh ]; then
                      source /root/miniconda3/etc/profile.d/conda.sh
                      conda activate batchgen
                  fi
                  cd "$WORKSPACE"
                  git fetch --no-tags origin "$PR_SHA"
                  rm -rf "$WORKTREE_PATH"
                  git worktree add "$WORKTREE_PATH" "$PR_SHA"
                  cd "$WORKTREE_PATH"
                  git log -1 --oneline
                  bash .github/workflows/scripts/pr-gpu-smoke-incontainer.sh
              '
