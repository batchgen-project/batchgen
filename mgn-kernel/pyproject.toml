[build-system]
requires = [
  "scikit-build-core>=0.10",
  "torch>=2.9.0",
  "wheel",
]
# Specifies the function that the build frontend (like pip) will call.
build-backend = "scikit_build_core.build"

[project]
name = "test-kernel-0ab602a9"
version = "0.1.5"
description = "Custom CUDA Kernels for BatchGen Project"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: GPU :: NVIDIA CUDA"
]
# Runtime dependencies would go here, but for a kernel library,
# dependencies are often handled by the environment (e.g., torch is already installed).
dependencies = []

[tool.wheel]
# Specifies files and directories to exclude from the final wheel.
exclude = [
  "dist*",
  "tests*",
]

[tool.scikit-build]
cmake.build-type = "Release"
minimum-version = "build-system.requires"

wheel.py-api = "cp39"
wheel.license-files = []
wheel.packages = ["python/mgn_kernel"]